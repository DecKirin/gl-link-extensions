# The marketplace's checks (MARKETPLACE.md).
name: marketplace
on:
  pull_request:
    paths: ["entries/**"]
  push:
    branches: [main]
    paths: ["entries/**"]

jobs:
  # Every entry holds up: its download is public, is the file the entry names, and is signed
  # by the entry's publisher. No secrets here, so a fork's pull request can run it. The tool
  # is built from main, so a pull request can't bring its own.
  check:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with: { path: pr }
      - uses: actions/checkout@v4
        with: { ref: main, path: main }
      - name: Build gllink-ext from main
        run: cd main && swift build --product gllink-ext
      - name: Check the entries
        run: main/.build/debug/gllink-ext market check pr/entries --previous main/entries

  # On main: the list the app reads, signed with the marketplace key.
  index:
    if: github.event_name == 'push'
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check the entries
        run: swift run gllink-ext market check entries
      - name: Write and sign the index
        env:
          GLLINK_EXT_KEY: ${{ secrets.MARKETPLACE_KEY }}
        run: swift run gllink-ext market index entries -o .
      - name: Commit it
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json index.json.sig
          git diff --cached --quiet || git commit -m "index: $(git log -1 --format=%s)"
          git push
